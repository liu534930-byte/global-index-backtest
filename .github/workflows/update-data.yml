name: Update real market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_data.py
      - .github/workflows/update-data.yml
  schedule:
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch Yahoo Finance and Eastmoney monthly data
        run: python update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新真实市场数据"
          git push
